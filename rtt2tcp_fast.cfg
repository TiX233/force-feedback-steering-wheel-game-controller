# 参考：
# Clion中OpenOCD结合SEGGER RTT高速输出调试信息：https://blog.csdn.net/qq_47288055/article/details/143437171
# 增加了一些配置，让数据更新更快，更不容易丢失数据

source [find interface/cmsis-dap.cfg]
# 使用 winUSB 后端，会比 HID 更快
cmsis_dap_backend usb_bulk
transport select swd

source [find target/py32f403.cfg]
adapter speed 10000

init
rtt setup 0x20000000 0x10000 "SEGGER RTT"
rtt start
# 更新间隔默认 100ms 左右，这里将更新间隔设置为 10ms
rtt polling_interval 10
rtt server start 2568 0
